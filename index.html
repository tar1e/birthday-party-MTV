<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашение</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f2f3f5;
    color: #1c1e21;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 720px;
    width: 100%;
    overflow: hidden;
  }
  .img-wrap {
    position: relative;
    line-height: 0;
  }
  .img-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }
  .bottom-link {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30%;
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="img-wrap">
      <img src="invitation.jpg" alt="Приглашение">
      <a class="bottom-link" href="https://forms.yandex.ru/u/6af3482249af476fbbd2bea3" target="_blank" rel="noopener" aria-label="НАЖМИ, ЧТОБЫ ЗАПОЛНИТЬ АНКЕТУ"></a>
    </div>
  </div>
</body>
</html>
