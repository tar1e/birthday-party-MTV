<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашение</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f2f3f5;
    color: #1c1e21;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 720px;
    width: 100%;
    overflow: hidden;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
  }
  .actions {
    padding: 20px 24px;
    text-align: center;
  }
  .btn {
    display: inline-block;
    background: #1f6feb;
    color: #ffffff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 999px;
    transition: background .15s ease, transform .05s ease;
  }
  .btn:hover { background: #1158c7; }
  .btn:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="card">
    <img src="invitation.jpg" alt="Приглашение">
    <div class="actions">
      <a class="btn" href="https://forms.yandex.ru/u/6af3482249af476fbbd2bea3" target="_blank" rel="noopener">НАЖМИ, ЧТОБЫ ЗАПОЛНИТЬ АНКЕТУ</a>
    </div>
  </div>
</body>
</html>
